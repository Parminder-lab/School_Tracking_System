<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amardeep School - Live Bus Tracking</title>
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-dark: #1B4D2E;
            --primary-green: #2E6F40;
            --accent-gold: #F4B41A;
            --bg-cream: #FFFDF7;
            --text-dark: #222222;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Header */
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-green));
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* School Logo Image Style */
        .school-logo-img {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-gold);
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .header-title-block {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #FFFFFF;
            line-height: 1.1;
        }

        .header-motto {
            font-size: 0.75rem;
            color: var(--accent-gold);
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .status-badge {
            background-color: var(--accent-gold);
            color: var(--primary-dark);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        /* Mode Selection Bar (Below Heading) */
        .mode-bar {
            background: #EAEFEA;
            padding: 10px 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid #D0DDD0;
        }

        .mode-btn {
            flex: 1;
            max-width: 200px;
            padding: 9px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--primary-green);
            background-color: white;
            color: var(--primary-green);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .mode-btn.active {
            background-color: var(--primary-green);
            color: white;
            box-shadow: 0 2px 6px rgba(46, 111, 64, 0.3);
        }

        /* Main App Body Layout */
        .app-container {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
            }
            .sidebar {
                width: 360px;
            }
            .map-view {
                flex: 1;
            }
        }

        /* Sidebar Panels */
        .panel {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #E2E8E2;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 12px;
            border-bottom: 2px solid #EAEFEA;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        select, button, input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #CCC;
            font-size: 0.95rem;
        }

        .btn-action {
            background-color: var(--primary-green);
            color: white;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-action.stop {
            background-color: #D32F2F;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F4F7F4;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .toggle-container input[type="checkbox"] {
            width: auto;
            transform: scale(1.2);
        }

        /* Metrics Display Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .metric-card {
            background-color: #F8FAF8;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-gold);
        }

        .metric-card .val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .metric-card .lbl {
            font-size: 0.75rem;
            color: #666;
        }

        /* Map Styling */
        #map {
            width: 100%;
            height: 420px;
            border-radius: 10px;
            border: 1px solid #D0DDD0;
            z-index: 1;
        }

        @media (min-width: 768px) {
            #map {
                height: 100%;
                min-height: 520px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Navigation Bar -->
    <header>
        <div class="brand-container">
            <img src="Amardeep Senior Secondary Logo .jpg" 
                 alt="Amardeep School Logo" 
                 class="school-logo-img"
                 onerror="this.onerror=null; this.src='logo.png';" />
            <div class="header-title-block">
                <div class="header-title">Amardeep School</div>
                <div class="header-motto">Service to Humanity</div>
            </div>
        </div>
        <div class="status-badge" id="liveBadge">Live Tracker</div>
    </header>

    <!-- Role Switcher Buttons -->
    <div class="mode-bar" id="modeSelectorBar">
        <button class="mode-btn active" id="btnParentView" onclick="switchView('parent')">Parent View</button>
        <button class="mode-btn" id="btnDriverView" onclick="requestDriverAccess()">Driver Mode</button>
    </div>

    <!-- Main Application Container -->
    <div class="app-container">
        
        <!-- Left Sidebar Controls -->
        <div class="sidebar">
            
            <!-- Parent Panel -->
            <div class="panel" id="parentPanel">
                <div class="panel-title">Track School Bus</div>
                
                <div class="form-group">
                    <label for="parentRouteSelect">Select Bus Route:</label>
                    <select id="parentRouteSelect" onchange="changeRoute(this.value)">
                        <option value="route1">Route 1: Bhatnura - Lubana</option>
                        <option value="route2">Route 2: Bhogpur Town</option>
                        <option value="route3">Route 3: Jalandhar Highway</option>
                    </select>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="lbl">Estimated Arrival</div>
                        <div class="val" id="etaVal">8 Mins</div>
                    </div>
                    <div class="metric-card">
                        <div class="lbl">Current Speed</div>
                        <div class="val" id="speedVal">32 km/h</div>
                    </div>
                    <div class="metric-card" style="grid-column: span 2;">
                        <div class="lbl">Distance From You</div>
                        <div class="val" id="distanceVal">Waiting for GPS...</div>
                    </div>
                </div>

                <div style="margin-top: 14px; font-size: 0.85rem; color: #555;">
                    <strong>Next Stop:</strong> <span id="nextStopLbl">Main Gate Stop</span>
                </div>
            </div>

            <!-- Driver Broadcast Panel (Protected by Password) -->
            <div class="panel" id="driverPanel" style="display: none;">
                <div class="panel-title">Driver Broadcast Panel</div>

                <div class="form-group">
                    <label for="driverRouteSelect">Assigned Bus Route:</label>
                    <select id="driverRouteSelect">
                        <option value="route1">Route 1: Bhatnura - Lubana</option>
                        <option value="route2">Route 2: Bhogpur Town</option>
                        <option value="route3">Route 3: Jalandhar Highway</option>
                    </select>
                </div>

                <div class="toggle-container">
                    <label for="autoScheduleCheck" style="margin: 0; cursor: pointer;">
                        Auto-Broadcast Shift Timings
                        <div style="font-size: 0.75rem; color: #666; font-weight: normal;">(05:45-09:00 AM & 01:00-04:00 PM)</div>
                    </label>
                    <input type="checkbox" id="autoScheduleCheck" checked />
                </div>
